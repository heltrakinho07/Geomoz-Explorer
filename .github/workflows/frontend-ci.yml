name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "artifacts/geomoz-react/**"
      - "lib/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/frontend-ci.yml"
      - "firebase.emulators.json"
      - "firestore.rules"
      - "storage.rules"
  pull_request:
    branches: [main]
    paths:
      - "artifacts/geomoz-react/**"
      - "lib/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/frontend-ci.yml"
      - "firebase.emulators.json"
      - "firestore.rules"
      - "storage.rules"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  firebase-integration:
    name: GIS Firebase emulator integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run test:gis:firebase
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: firebase-emulator-logs
          path: "*-debug.log"
          retention-days: 7

  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run typecheck
        run: pnpm run typecheck
        env:
          PORT: "5173"
          BASE_PATH: "/"
          CI: "true"

  gis-smoke-tests:
    name: GIS processing smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run GIS processing smoke tests
        run: pnpm --dir artifacts/geomoz-react exec vitest run src/components/__tests__/GISWorkspaceOverview.test.tsx src/components/__tests__/GISWorkspaceMapLibre.test.tsx src/lib/__tests__/gis-local-dem-project.test.ts src/lib/__tests__/gis-local-geotiff.test.ts src/lib/__tests__/gis-workspace-pro-storage.test.ts src/lib/__tests__/gis-workspace-device-storage.test.ts src/lib/__tests__/terrain-workflow.test.ts src/lib/__tests__/terrain-workflow-client.test.ts src/components/__tests__/TerrainWorkflowPanel.test.tsx src/lib/__tests__/gis-workspace-sync-readiness.test.ts src/lib/__tests__/gis-geos-reference.test.ts src/lib/__tests__/gis-workspace-processing.test.ts src/lib/__tests__/gis-vector-engine.test.ts src/lib/__tests__/gis-workspace-sync-queue.test.ts src/lib/__tests__/gis-vector-runner.test.ts src/lib/__tests__/whitebox-runtime.test.ts src/lib/__tests__/ogc-wfs.test.ts src/lib/__tests__/gis-data-sources.test.ts src/lib/__tests__/gis-model-graph.test.ts src/lib/__tests__/gis-processing-jobs.test.ts
        env:
          CI: "true"

  report-export-tests:
    name: Report integrity tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify report export safety
        run: pnpm --dir artifacts/geomoz-react exec vitest run src/lib/__tests__/report-export.test.ts src/pages/__tests__/legal-pages.test.tsx src/lib/__tests__/gee-connection-diagnostics.test.ts src/pages/__tests__/gee-auth-clickable.test.ts src/lib/__tests__/gee-ndvi-validation.test.ts src/components/__tests__/GeoAgentMarkdown.test.tsx src/pages/__tests__/gee-processing-time-controls.test.ts src/pages/__tests__/geoanalises-mobile-results.test.tsx src/components/__tests__/Basemap3DRestriction.test.tsx
        env:
          CI: "true"

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: [typecheck, gis-smoke-tests, report-export-tests, firebase-integration]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build frontend
        run: pnpm run build
        env:
          PORT: "5173"
          BASE_PATH: "/"
          CI: "true"
          NODE_ENV: "production"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: artifacts/geomoz-react/dist/public/
          retention-days: 7
          if-no-files-found: error

  lint:
    name: Lint (Prettier)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Check formatting with Prettier
        run: npx prettier --check "artifacts/geomoz-react/src/**/*.{ts,tsx}" "lib/**/*.ts"
        continue-on-error: true
