name: Deploy Frontend to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  build-and-deploy:
    name: Build and Deploy to Firebase Hosting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build frontend
        run: pnpm --filter @workspace/geomoz-react run build
        env:
          PORT: "5173"
          BASE_PATH: "/"
          CI: "true"
          NODE_ENV: "production"
          # Same-origin /geomoz-api/** is forwarded by Firebase Hosting to Cloud Run.
          VITE_API_BASE: ""
          VITE_GIS_WORKSPACE_ENGINE: "geolibre"
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: "geomoz.geolithica.com"
          VITE_FIREBASE_PROJECT_ID: geoprocessamento-426809
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}

      - name: Validate crawlable OAuth legal pages
        run: |
          test -s artifacts/geomoz-react/dist/public/privacy.html
          test -s artifacts/geomoz-react/dist/public/terms.html
          grep -q 'Política de Privacidade' artifacts/geomoz-react/dist/public/privacy.html
          grep -q 'Google Earth Engine' artifacts/geomoz-react/dist/public/privacy.html
          grep -q 'href="/privacy"' artifacts/geomoz-react/dist/public/index.html
          grep -q '"cleanUrls": true' firebase.json

      - name: Checkout pinned GeoLibre Web source (MIT)
        uses: actions/checkout@v4
        with:
          repository: opengeos/GeoLibre
          ref: f69688ed5be750c496b51b865cee513d910a433f
          path: .geolibre-upstream
          persist-credentials: false

      - name: Set up Node.js 24 for upstream GeoLibre
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: .geolibre-upstream/package-lock.json

      - name: Install upstream GeoLibre dependencies
        working-directory: .geolibre-upstream
        run: npm ci --no-audit --no-fund

      - name: Build original GeoLibre Web app
        working-directory: .geolibre-upstream
        env:
          GEOLIBRE_APP_BASE: "/gis-workspace/"
          VITE_GEOLIBRE_APP_NAME: "GeoMoz GIS Workspace"
          GEOLIBRE_STRIP_CREDENTIALS: "1"
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npm run build

      - name: Add GeoMoz branding and original license to published GeoLibre
        run: |
          node --test scripts/tests/brand-geolibre-web.test.mjs
          node scripts/brand-geolibre-web.mjs \
            .geolibre-upstream/apps/geolibre-desktop/dist \
            artifacts/geomoz-react/dist/public/gis-workspace \
            .geolibre-upstream/LICENSE
          test -s artifacts/geomoz-react/dist/public/gis-workspace/index.html
          test -s artifacts/geomoz-react/dist/public/gis-workspace/GEOLIBRE-LICENSE.txt
          grep -q '/gis-workspace/' artifacts/geomoz-react/dist/public/gis-workspace/index.html
          grep -q '"GeoMoz GIS Workspace"' artifacts/geomoz-react/dist/public/gis-workspace/deployment.json

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: geoprocessamento-426809

      - name: Verify Firebase to Cloud Run rewrite
        run: |
          HEALTH_URL="https://geoprocessamento-426809.web.app/geomoz-api/health"
          echo "Testing same-origin API proxy: $HEALTH_URL"
          RESPONSE=$(curl --fail --silent --show-error --max-time 45 --retry 2 "$HEALTH_URL")
          echo "$RESPONSE" | python3 -c 'import sys,json; data=json.load(sys.stdin); assert data.get("status") == "ok", "Firebase served HTML or an unhealthy API instead of Cloud Run JSON"'
          echo "Firebase Hosting forwards /geomoz-api/health to Cloud Run successfully"

      - name: Show deployed URL
        run: |
          echo "✅ Frontend deployed to Firebase Hosting"
          echo "URL: https://geoprocessamento-426809.web.app"

  firestore-security-rules:
    name: Deploy Cloud Firestore security rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Deploy Firestore rules (required)
        run: npx --yes firebase-tools@14.22.0 deploy --only firestore:rules --project geoprocessamento-426809

  storage-security-rules:
    name: Deploy Firebase Storage security rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Deploy Storage rules (required)
        run: npx --yes firebase-tools@14.22.0 deploy --only storage --project geoprocessamento-426809
