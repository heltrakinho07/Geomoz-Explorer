name: Deploy Frontend to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  build-and-deploy:
    name: Build and Deploy to Firebase Hosting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build frontend
        run: pnpm --filter @workspace/geomoz-react run build
        env:
          PORT: "5173"
          BASE_PATH: "/"
          CI: "true"
          NODE_ENV: "production"
          # Same-origin /geomoz-api/** is forwarded by Firebase Hosting to Cloud Run.
          VITE_API_BASE: ""
          VITE_GIS_WORKSPACE_ENGINE: "geolibre"
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: "geomoz.geolithica.com"
          VITE_FIREBASE_PROJECT_ID: geoprocessamento-426809
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}

      - name: Validate crawlable OAuth legal pages
        run: |
          test -s artifacts/geomoz-react/dist/public/privacy.html
          test -s artifacts/geomoz-react/dist/public/terms.html
          grep -q 'Política de Privacidade' artifacts/geomoz-react/dist/public/privacy.html
          grep -q 'Google Earth Engine' artifacts/geomoz-react/dist/public/privacy.html
          grep -q 'href="/privacy"' artifacts/geomoz-react/dist/public/index.html
          grep -q '"cleanUrls": true' firebase.json

      - name: Checkout pinned GeoLibre Web source (MIT)
        uses: actions/checkout@v4
        with:
          repository: opengeos/GeoLibre
          ref: f69688ed5be750c496b51b865cee513d910a433f
          path: .geolibre-upstream
          persist-credentials: false

      - name: Set up Node.js 24 for upstream GeoLibre
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: .geolibre-upstream/package-lock.json

      - name: Install upstream GeoLibre dependencies
        working-directory: .geolibre-upstream
        run: npm ci --no-audit --no-fund

      - name: Prepare GeoMoz-owned React interface
        run: node scripts/prepare-geomoz-workbench.mjs .geolibre-upstream

      - name: Build GeoMoz Workbench
        working-directory: .geolibre-upstream
        env:
          GEOLIBRE_APP_BASE: "/gis-workspace/"
          VITE_GEOLIBRE_APP_NAME: "GeoMoz GIS Workspace"
          GEOLIBRE_STRIP_CREDENTIALS: "1"
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npm run build

      - name: Package GeoMoz Workbench and retain engine license
        run: |
          node --test scripts/tests/brand-geolibre-web.test.mjs scripts/tests/geomoz-gis-shell.test.mjs scripts/tests/geomoz-theme.test.mjs scripts/tests/geomoz-unified-brand-icon.test.mjs scripts/tests/geomoz-brand-locales.test.mjs scripts/tests/seismic-data.test.mjs scripts/tests/seismic-analytics.test.mjs scripts/tests/geomoz-workbench-profile.test.mjs scripts/tests/geomoz-cartography.test.mjs scripts/tests/geomoz-georeference.test.mjs scripts/tests/geomoz-digitizing.test.mjs scripts/tests/geomoz-project-format.test.mjs
          node scripts/brand-geolibre-web.mjs \
            .geolibre-upstream/apps/geolibre-desktop/dist \
            artifacts/geomoz-react/dist/public/gis-workspace \
            .geolibre-upstream/LICENSE
          test -s artifacts/geomoz-react/dist/public/gis-workspace/index.html
          test -s artifacts/geomoz-react/dist/public/gis-workspace/GEOLIBRE-LICENSE.txt
          test -s artifacts/geomoz-react/dist/public/gis-workspace/third-party-notices.html
          grep -q 'Créditos e licenças de terceiros' artifacts/geomoz-react/dist/public/gis-workspace/third-party-notices.html
          test -s artifacts/geomoz-react/dist/public/gis-workspace/geomoz-brand.css
          test -s artifacts/geomoz-react/dist/public/gis-workspace/favicon.svg
          test -s artifacts/geomoz-react/dist/public/gis-workspace/geomoz-theme.js
          grep -q 'data-geomoz-app="workbench"' artifacts/geomoz-react/dist/public/gis-workspace/index.html
          grep -q '"GeoMoz GIS Workspace"' artifacts/geomoz-react/dist/public/gis-workspace/manifest.webmanifest
          grep -q '/gis-workspace/' artifacts/geomoz-react/dist/public/gis-workspace/index.html
          grep -q '"GeoMoz GIS Workspace"' artifacts/geomoz-react/dist/public/gis-workspace/deployment.json

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: geoprocessamento-426809

      - name: Verify Firebase to Cloud Run rewrite
        run: |
          HEALTH_URL="https://geoprocessamento-426809.web.app/geomoz-api/health"
          echo "Testing same-origin API proxy: $HEALTH_URL"
          RESPONSE=$(curl --fail --silent --show-error --max-time 45 --retry 2 "$HEALTH_URL")
          echo "$RESPONSE" | python3 -c 'import sys,json; data=json.load(sys.stdin); assert data.get("status") == "ok", "Firebase served HTML or an unhealthy API instead of Cloud Run JSON"'
          echo "Firebase Hosting forwards /geomoz-api/health to Cloud Run successfully"

      - name: Verify deployed GeoMoz Workbench
        run: |
          BASE="https://geoprocessamento-426809.web.app/gis-workspace"
          curl --fail --silent --show-error --location --retry 2 --max-time 60 "$BASE/" -o "$RUNNER_TEMP/geolibre-index.html"
          grep -q 'id="root"' "$RUNNER_TEMP/geolibre-index.html"
          grep -q 'data-geomoz-app="workbench"' "$RUNNER_TEMP/geolibre-index.html"
          grep -q 'content="GeoMoz GIS Workspace"' "$RUNNER_TEMP/geolibre-index.html"
          grep -q 'GeoMoz GIS Workspace:' "$RUNNER_TEMP/geolibre-index.html"
          grep -q '/gis-workspace/assets/' "$RUNNER_TEMP/geolibre-index.html"
          curl --fail --silent --show-error --location --retry 2 --max-time 60 "$BASE/deployment.json" -o "$RUNNER_TEMP/geolibre-policy.json"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["branding"]["appName"]=="GeoMoz GIS Workspace"; assert d["sharing"]["shareUrl"]=="off"' "$RUNNER_TEMP/geolibre-policy.json"
          curl --fail --silent --show-error --location --retry 2 --max-time 60 "$BASE/sw.js" -o "$RUNNER_TEMP/geolibre-sw.js"
          test -s "$RUNNER_TEMP/geolibre-sw.js"
          curl --fail --silent --show-error --location --retry 2 --max-time 60 "$BASE/geomoz-brand.css" -o "$RUNNER_TEMP/geomoz-gis-theme.css"
          grep -q -- '--geomoz-blue: #0284c7' "$RUNNER_TEMP/geomoz-gis-theme.css"
          grep -q -- 'gm-workbench-chrome' "$RUNNER_TEMP/geomoz-gis-theme.css"
          grep -q -- 'gm-catalog' "$RUNNER_TEMP/geomoz-gis-theme.css"
          curl --fail --silent --show-error --location --retry 2 --max-time 60 "$BASE/geomoz-theme.js" -o "$RUNNER_TEMP/geomoz-gis-shell.js"
          grep -q -- 'GeoMozTheme' "$RUNNER_TEMP/geomoz-gis-shell.js"
          curl --fail --silent --show-error --location --retry 2 --max-time 60 "$BASE/manifest.webmanifest" -o "$RUNNER_TEMP/geomoz-gis-manifest.json"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["name"]=="GeoMoz GIS Workspace" and d["scope"]=="/gis-workspace/"' "$RUNNER_TEMP/geomoz-gis-manifest.json"
          curl --fail --silent --show-error --location --retry 2 --max-time 60 "$BASE/third-party-notices.html" -o "$RUNNER_TEMP/geomoz-thirdparty.html"
          grep -q 'Qiusheng Wu' "$RUNNER_TEMP/geomoz-thirdparty.html"
          curl --fail --silent --show-error --location --retry 2 --max-time 60 "$BASE/favicon.svg" -o "$RUNNER_TEMP/geomoz-gis-favicon.svg"
          grep -q 'linearGradient' "$RUNNER_TEMP/geomoz-gis-favicon.svg"
          curl --fail --silent --show-error --location --retry 2 --max-time 60 "https://geomoz.geolithica.com/favicon.svg" -o "$RUNNER_TEMP/geomoz-site-favicon.svg"
          cmp "$RUNNER_TEMP/geomoz-site-favicon.svg" "$RUNNER_TEMP/geomoz-gis-favicon.svg"
          echo "GeoMoz portal and GIS Workspace publish the exact same canonical icon"

          curl --fail --silent --show-error --location --retry 2 --max-time 60 "https://geomoz.geolithica.com/gis-workspace/" -o "$RUNNER_TEMP/geomoz-custom-index.html"
          grep -q 'data-geomoz-app="workbench"' "$RUNNER_TEMP/geomoz-custom-index.html"
          ! grep -q 'geomoz-shell.js' "$RUNNER_TEMP/geomoz-custom-index.html"
          curl --fail --silent --show-error --location --retry 2 --max-time 60 "https://geomoz.geolithica.com/gis-workspace/deployment.json" -o "$RUNNER_TEMP/geomoz-custom-policy.json"
          python3 -c 'import json,sys,os; d=json.load(open(sys.argv[1])); assert d["interface"]["name"]=="geomoz-workbench"; assert d["interface"]["revision"]==os.environ["GITHUB_SHA"]' "$RUNNER_TEMP/geomoz-custom-policy.json"
          curl --fail --silent --show-error --location --retry 2 --max-time 60 "https://geomoz.geolithica.com/geomoz-theme.js" -o "$RUNNER_TEMP/geomoz-global-theme.js"
          grep -q 'GeoMozTheme' "$RUNNER_TEMP/geomoz-global-theme.js"
          curl --fail --silent --show-error --location --retry 2 --max-time 60 "https://geomoz.geolithica.com/privacy" -o "$RUNNER_TEMP/geomoz-privacy.html"
          grep -q '/geomoz-theme.js' "$RUNNER_TEMP/geomoz-privacy.html"
          echo "GeoMoz Workbench and global theme are live on geomoz.geolithica.com"

      - name: Show deployed URL
        run: |
          echo "✅ Frontend deployed to Firebase Hosting"
          echo "URL: https://geoprocessamento-426809.web.app"

  firestore-security-rules:
    name: Deploy Cloud Firestore security rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Deploy Firestore rules (required)
        run: npx --yes firebase-tools@14.22.0 deploy --only firestore:rules --project geoprocessamento-426809

  storage-security-rules:
    name: Deploy Firebase Storage security rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Deploy Storage rules (required)
        run: npx --yes firebase-tools@14.22.0 deploy --only storage --project geoprocessamento-426809
