name: Deploy Frontend to Firebase Hosting

on:
  push:
    branches: [main, fix/geology-invalid-geometry]
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  build-and-deploy:
    name: Build and Deploy to Firebase Hosting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build frontend
        run: pnpm --filter @workspace/geomoz-react run build
        env:
          PORT: "5173"
          BASE_PATH: "/"
          CI: "true"
          NODE_ENV: "production"
          VITE_API_BASE: ""
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: geoprocessamento-426809
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: geoprocessamento-426809

      - name: Deploy Firestore rules
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          CREDENTIALS_FILE="${RUNNER_TEMP}/firebase-service-account.json"
          trap 'rm -f "${CREDENTIALS_FILE}"' EXIT
          printf '%s' "${FIREBASE_SERVICE_ACCOUNT_JSON}" > "${CREDENTIALS_FILE}"
          chmod 600 "${CREDENTIALS_FILE}"
          export GOOGLE_APPLICATION_CREDENTIALS="${CREDENTIALS_FILE}"
          npx --yes firebase-tools deploy \
            --only firestore:rules \
            --project geoprocessamento-426809 \
            --non-interactive

      - name: Deploy Storage deny rules when Firebase Storage is enabled
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set +e
          CREDENTIALS_FILE="${RUNNER_TEMP}/firebase-storage-service-account.json"
          trap 'rm -f "${CREDENTIALS_FILE}"' EXIT
          printf '%s' "${FIREBASE_SERVICE_ACCOUNT_JSON}" > "${CREDENTIALS_FILE}"
          chmod 600 "${CREDENTIALS_FILE}"
          export GOOGLE_APPLICATION_CREDENTIALS="${CREDENTIALS_FILE}"

          npx --yes firebase-tools deploy \
            --only storage \
            --project geoprocessamento-426809 \
            --non-interactive
          STATUS=$?

          if [ "${STATUS}" -ne 0 ]; then
            echo "::warning::Firebase Hosting and Firestore rules deployed, but Storage rules could not be deployed because firebasestorage.googleapis.com is not enabled for this project. Enable the API once and rerun this workflow; until then Firebase client Storage remains unavailable."
          else
            echo "✅ Firebase Storage deny rules deployed."
          fi
          exit 0

      - name: Show deployed URL
        run: |
          echo "✅ Frontend deployed to Firebase Hosting"
          echo "URL: https://geoprocessamento-426809.web.app"
