name: GeoMoz authenticated print gateway CI

on:
  pull_request:
    branches: [main]
    paths:
      - "geomoz-explorer/print_gateway.py"
      - "geomoz-explorer/print_job.py"
      - "geomoz-explorer/tests/test_print_gateway.py"
      - "geomoz-explorer/api.py"
      - "geomoz-explorer/Dockerfile"
      - "geomoz-explorer/requirements-api.txt"
      - "services/geomoz-qgis-print/job.py"
      - "scripts/assets/workbench/GeoMozQgisPrintPanel.tsx"
      - "scripts/assets/workbench/geomoz-print-client.ts"
      - "artifacts/geomoz-react/src/components/WorkspaceAuthBridge.tsx"
      - ".github/workflows/geomoz-print-gateway-ci.yml"
  push:
    branches: [main]
    paths:
      - "geomoz-explorer/print_gateway.py"
      - "geomoz-explorer/print_job.py"
      - "geomoz-explorer/tests/test_print_gateway.py"
      - "services/geomoz-qgis-print/job.py"
      - ".github/workflows/geomoz-print-gateway-ci.yml"
  workflow_dispatch:

jobs:
  print-gateway-security:
    name: Firebase print security, GCS worker and schema tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install gateway test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi>=0.100" "httpx>=0.25" \
            "firebase-admin>=6.5.0" "google-cloud-storage>=2.16.0" \
            "google-cloud-tasks>=2.16.0"
      - name: Compile gateway files
        run: python -m py_compile geomoz-explorer/print_job.py geomoz-explorer/print_gateway.py
      - name: Test bounded schema, API authentication and worker lifecycle
        env:
          PYTHONPATH: geomoz-explorer
        run: python -m unittest discover -s geomoz-explorer/tests -p test_print_gateway.py -v
      - name: Check no production secrets are present in front-end print sources
        run: |
          ! grep -q GEOMOZ_PRINT_WORKER_TOKEN scripts/assets/workbench/GeoMozQgisPrintPanel.tsx
          ! grep -q GEOMOZ_PRINT_WORKER_TOKEN scripts/assets/workbench/geomoz-print-client.ts

  workspace-print-regression:
    name: Workspace print UI contract smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run browser adapter and print-contract source tests
        run: node --experimental-strip-types --test scripts/tests/geomoz-qgis-print-job.test.mjs
