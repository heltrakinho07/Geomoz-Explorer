name: Preview GIS Workspace on Firebase

on:
  pull_request:
    branches:
      - feat/geomoz-p2-report-maps
    types: [opened, synchronize, reopened]

concurrency:
  group: geomoz-gis-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  preview:
    if: github.head_ref == 'feat/geomoz-gis-workspace'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck frontend
        run: pnpm --filter @workspace/geomoz-react run typecheck

      - name: Build frontend
        run: pnpm --filter @workspace/geomoz-react run build
        env:
          PORT: "5173"
          BASE_PATH: "/"
          CI: "true"
          NODE_ENV: "production"
          VITE_API_BASE: "https://geomoz-explorer-api-gay72ifazq-ew.a.run.app"
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: "geomoz.geolithica.com"
          VITE_FIREBASE_PROJECT_ID: geoprocessamento-426809
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}

      - name: Deploy Firebase preview
        id: preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: geoprocessamento-426809
          channelId: gis-workspace-pr-${{ github.event.pull_request.number }}
          expires: 7d
