name: Python Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "geomoz-explorer/**"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/python-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "geomoz-explorer/**"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/python-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            geomoz-explorer/requirements.txt

      - name: Install system dependencies (GDAL, GEOS, etc.)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            gfortran \
            libatlas-base-dev \
            libopenblas-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with pytest
        run: |
          python -m pytest geomoz-explorer/tests/ \
            -v \
            --tb=short \
            -x
        env:
          DISABLE_RATE_LIMIT: "true"
          CI: "true"

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check geomoz-explorer/ --output-format=github
        continue-on-error: true

      - name: Run ruff format check
        run: ruff format geomoz-explorer/ --check --diff
        continue-on-error: true

  check-presets:
    name: Preset integrity check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify gee_presets (zero external deps)
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'geomoz-explorer')
          from gee_presets import INDEX_REGISTRY, MINERAL_PRESETS
          print(f'✓ {len(INDEX_REGISTRY)} indices registered')
          print(f'✓ {len(MINERAL_PRESETS)} mineral presets registered')
          for k, v in INDEX_REGISTRY.items():
            assert 'needs' in v, f'{k} missing needs'
            assert 'vis' in v, f'{k} missing vis'
            assert 'norm' in v, f'{k} missing norm'
          print('✓ All presets validated')
          "
        env:
          DISABLE_RATE_LIMIT: "true"

  container-smoke:
    name: Backend Docker boot smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build production container
        run: docker build -t geomoz-api-smoke ./geomoz-explorer

      - name: Confirm API starts and serves health endpoint
        run: |
          set -euo pipefail
          docker run -d --name geomoz-api-smoke --memory=1g --memory-swap=1g -p 127.0.0.1:5003:5003 \
            -e PORT=5003 -e DISABLE_RATE_LIMIT=true geomoz-api-smoke
          trap 'docker logs geomoz-api-smoke --tail 60 || true; docker rm -f geomoz-api-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 45); do
            if curl --max-time 3 --fail --silent http://127.0.0.1:5003/geomoz-api/health \
              | grep -q '"status":"ok"'; then
              echo 'GeoMoz production API container passed boot/health smoke.'
              break
            fi
            sleep 2
          done
          if ! curl --max-time 3 --fail --silent http://127.0.0.1:5003/geomoz-api/health \
            | grep -q '"status":"ok"'; then
            echo 'GeoMoz production API container did not become healthy.' >&2
            exit 1
          fi
          echo 'Checking lazily imported GEOAGENTE Python modules inside production container'
          docker exec geomoz-api-smoke python -c 'from agent.planner import GeoMozAgent; from agent.registry import ToolDispatcher; from agent.geology_data import summarize_geology; print("GEOAGENTE modules import OK")'
          echo 'Running end-to-end Manica geology chat against production Docker image'
          python - <<'PY'
          import json
          import urllib.request

          url = "http://127.0.0.1:5003/geomoz-api/ai/agent-chat"
          payload = json.dumps({
              "message": "Quais são as principais litologias de Manica? Mostra no mapa.",
              "current_map_state": {
                  "aoi": {"province": None, "district": None, "geometry": None},
                  "temporalWindow": {"startDate": "2024-01-01", "endDate": "2024-12-31"},
              },
              "provider": "auto",
          }).encode("utf-8")
          request = urllib.request.Request(url, data=payload, headers={
              "Content-Type": "application/json",
          }, method="POST")
          with urllib.request.urlopen(request, timeout=150) as response:
              assert response.status == 200, response.status
              result = json.load(response)
          assert result.get("status") == "completed", result.get("synthesis") or result.get("status")
          assert result.get("map_actions"), "Geology summary failed to create map action"
          print("GEOAGENTE answered the real Manica geology query inside the Docker image")
          PY
