name: Python Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "geomoz-explorer/**"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/python-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "geomoz-explorer/**"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/python-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            geomoz-explorer/requirements.txt

      - name: Install system dependencies (GDAL, GEOS, etc.)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            gfortran \
            libatlas-base-dev \
            libopenblas-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with pytest
        run: |
          python -m pytest geomoz-explorer/tests/ \
            -v \
            --tb=short \
            -x
        env:
          DISABLE_RATE_LIMIT: "true"
          CI: "true"


  docker-startup-smoke:
    name: Cloud Run container startup smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Cloud Run image
        run: docker build -f geomoz-explorer/Dockerfile -t geomoz-api-smoke:ci geomoz-explorer

      - name: Verify FastAPI launches and binds port 5003
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name geomoz-api-smoke -p 18083:5003 -e PORT=5003 geomoz-api-smoke:ci
          trap 'docker logs geomoz-api-smoke || true; docker rm -f geomoz-api-smoke || true' EXIT
          for n in $(seq 1 36); do
            if curl --silent --show-error --fail http://127.0.0.1:18083/geomoz-api/health; then
              echo "Cloud Run image bound PORT=5003 successfully"
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' geomoz-api-smoke)" != "true" ]; then
              echo "::error::API process exited during container startup"
              exit 1
            fi
            sleep 5
          done
          echo "::error::FastAPI failed to listen on PORT=5003"
          exit 1

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check geomoz-explorer/ --output-format=github
        continue-on-error: true

      - name: Run ruff format check
        run: ruff format geomoz-explorer/ --check --diff
        continue-on-error: true

  check-presets:
    name: Preset integrity check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify gee_presets (zero external deps)
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'geomoz-explorer')
          from gee_presets import INDEX_REGISTRY, MINERAL_PRESETS
          print(f'✓ {len(INDEX_REGISTRY)} indices registered')
          print(f'✓ {len(MINERAL_PRESETS)} mineral presets registered')
          for k, v in INDEX_REGISTRY.items():
            assert 'needs' in v, f'{k} missing needs'
            assert 'vis' in v, f'{k} missing vis'
            assert 'norm' in v, f'{k} missing norm'
          print('✓ All presets validated')
          "
        env:
          DISABLE_RATE_LIMIT: "true"
