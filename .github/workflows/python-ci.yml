name: Python Backend CI

on:
  push:
    branches: [main, develop, fix/geology-invalid-geometry]
    paths:
      - "geomoz-explorer/**"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/python-ci.yml"
  pull_request:
    branches: [main, fix/geology-invalid-geometry]
    paths:
      - "geomoz-explorer/**"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/python-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            geomoz-explorer/requirements.txt

      - name: Install system dependencies (GDAL, GEOS, etc.)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            gfortran \
            libatlas-base-dev \
            libopenblas-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with pytest
        run: |
          python -m pytest geomoz-explorer/tests/ \
            -v \
            --tb=short \
            -x
        env:
          DISABLE_RATE_LIMIT: "true"
          CI: "true"

  subscription-integration:
    name: Subscription usage (Firestore emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: pip install "firebase-admin>=6.5,<8" fastapi httpx pytest
      - env:
          PYTHONPATH: geomoz-explorer
        run: >-
          npx --yes firebase-tools@14.22.0 emulators:exec
          --config firebase.emulators.json --only firestore --project demo-geomoz-usage
          "python -m pytest -q geomoz-explorer/tests/test_subscription_usage_emulator.py"

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check geomoz-explorer/ --output-format=github
        continue-on-error: true

      - name: Run ruff format check
        run: ruff format geomoz-explorer/ --check --diff
        continue-on-error: true

  check-presets:
    name: Preset integrity check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify gee_presets (zero external deps)
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'geomoz-explorer')
          from gee_presets import INDEX_REGISTRY, MINERAL_PRESETS
          print(f'✓ {len(INDEX_REGISTRY)} indices registered')
          print(f'✓ {len(MINERAL_PRESETS)} mineral presets registered')
          for k, v in INDEX_REGISTRY.items():
            assert 'needs' in v, f'{k} missing needs'
            assert 'vis' in v, f'{k} missing vis'
            assert 'norm' in v, f'{k} missing norm'
          print('✓ All presets validated')
          "
        env:
          DISABLE_RATE_LIMIT: "true"

  container-smoke:
    name: Backend Docker boot smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build production container
        run: docker build -t geomoz-api-smoke ./geomoz-explorer

      - name: Confirm API starts and serves health endpoint
        run: |
          set -euo pipefail
          docker run -d --name geomoz-api-smoke --memory=1g --memory-swap=1g -p 127.0.0.1:5003:5003 \
            -e PORT=5003 -e DISABLE_RATE_LIMIT=true -e CI=true -e GEOMOZ_FEATURE_FLAGS_TEST_MODE=true geomoz-api-smoke
          trap 'docker logs geomoz-api-smoke --tail 60 || true; docker rm -f geomoz-api-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 45); do
            if curl --max-time 3 --fail --silent http://127.0.0.1:5003/geomoz-api/health \
              | grep -q '"status":"ok"'; then
              echo 'GeoMoz production API container passed boot/health smoke.'
              break
            fi
            sleep 2
          done
          if ! curl --max-time 3 --fail --silent http://127.0.0.1:5003/geomoz-api/health \
            | grep -q '"status":"ok"'; then
            echo 'GeoMoz production API container did not become healthy.' >&2
            exit 1
          fi
          echo 'Checking lazily imported GEOAGENTE Python modules inside production container'
          docker exec geomoz-api-smoke python -c 'import gee_module; from agent.planner import GeoMozAgent; from agent.registry import ToolDispatcher; from agent.geology_data import summarize_geology; print("GEOAGENTE modules import OK")'
          echo 'Checking real municipal polygons packaged by GeoMoz'
          docker exec geomoz-api-smoke python -c 'from agent.municipal_boundaries import DISTRICTS, municipal_districts; from agent.earth_engine_tools import validate_geometry; units = municipal_districts(); assert units.keys() == DISTRICTS.keys(), f"Missing Maputo districts: {DISTRICTS.keys() - units.keys()}"; [validate_geometry(unit["geometry"]) for unit in units.values()]'
          echo 'Running end-to-end Manica geology chat against production Docker image'
          python - <<'PY'
          import json
          import urllib.request

          url = "http://127.0.0.1:5003/geomoz-api/ai/agent-chat"
          payload = json.dumps({
              "message": "Quais são as principais litologias de Manica? Mostra no mapa.",
              "current_map_state": {
                  "aoi": {"province": None, "district": None, "geometry": None},
                  "temporalWindow": {"startDate": "2024-01-01", "endDate": "2024-12-31"},
              },
              "provider": "auto",
          }).encode("utf-8")
          request = urllib.request.Request(url, data=payload, headers={
              "Content-Type": "application/json",
          }, method="POST")
          with urllib.request.urlopen(request, timeout=150) as response:
              assert response.status == 200, response.status
              result = json.load(response)
          assert result.get("status") == "completed", result.get("synthesis") or result.get("status")
          assert result.get("map_actions"), "Geology summary failed to create map action"
          print("GEOAGENTE answered the real Manica geology query inside the Docker image")
          ndvi_request = urllib.request.Request(
              url,
              data=json.dumps({
                  "message": "Calcular estatísticas zonais de NDVI entre 2025-05-01 e 2025-09-01",
                  "current_map_state": {"aoi": {"source": "mozambique", "province": "Cabo Delgado", "district": "Montepuez"}},
              }).encode("utf-8"),
              headers={"Content-Type": "application/json"}, method="POST",
          )
          with urllib.request.urlopen(ndvi_request, timeout=30) as response:
              ndvi = json.load(response)
          assert ndvi.get("status") == "error", ndvi
          assert "Autenticação GeoMoz necessária" in ndvi["synthesis"], ndvi["synthesis"]
          vector_request = urllib.request.Request(
              "http://127.0.0.1:5003/geomoz-api/ai/geology-features",
              data=json.dumps({"province": "Manica"}).encode("utf-8"),
              headers={"Content-Type": "application/json"}, method="POST",
          )
          with urllib.request.urlopen(vector_request, timeout=150) as response:
              assert response.status == 200
              vector = json.load(response)
          assert vector["type"] == "FeatureCollection"
          assert vector["features"], "Real Manica vectors missing"
          assert len(vector["features"]) <= 700, "Vector layer exceeds map rendering budget"
          assert vector.get("originalFeatureCount", 0) >= len(vector["features"])
          print("Real Manica vector data is renderable within the feature budget")
          PY
