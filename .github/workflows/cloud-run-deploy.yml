name: Deploy to Google Cloud Run

on:
  push:
    branches: [main, fix/geology-invalid-geometry]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: europe-west1
  SERVICE_NAME: geomoz-explorer-api
  WORKER_SERVICE_NAME: geomoz-analysis-worker
  IMAGE_NAME: geomoz-explorer-api
  TASK_QUEUE: geomoz-analysis

jobs:
  deploy:
    name: Build and Deploy to Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Google Cloud Authentication
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build Docker image
        run: |
          docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ env.SERVICE_NAME }}:latest \
            geomoz-explorer/

      - name: Push Docker image to Artifact Registry
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ env.SERVICE_NAME }}:latest

      - name: Resolve runtime service account
        id: runtime
        env:
          CONFIGURED_RUNTIME_SA: ${{ secrets.GCP_RUNTIME_SERVICE_ACCOUNT }}
        run: |
          if [ -n "${CONFIGURED_RUNTIME_SA}" ]; then
            RUNTIME_SA="${CONFIGURED_RUNTIME_SA}"
          else
            PROJECT_NUMBER=$(gcloud projects describe "${PROJECT_ID}" --format='value(projectNumber)')
            RUNTIME_SA="${PROJECT_NUMBER}-compute@developer.gserviceaccount.com"
          fi
          echo "service_account=${RUNTIME_SA}" >> "${GITHUB_OUTPUT}"
          echo "Using Cloud Run runtime identity: ${RUNTIME_SA}"

      - name: Check Cloud Tasks API
        id: tasks-api
        run: |
          set +e
          ENABLED=$(gcloud services list \
            --enabled \
            --project "${PROJECT_ID}" \
            --filter='config.name:cloudtasks.googleapis.com' \
            --format='value(config.name)' 2>/dev/null)

          if [ "${ENABLED}" = "cloudtasks.googleapis.com" ]; then
            echo "Cloud Tasks API is already enabled."
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "Cloud Tasks API is not enabled. Attempting one-time bootstrap..."
          gcloud services enable cloudtasks.googleapis.com \
            --project "${PROJECT_ID}" \
            --quiet
          STATUS=$?

          if [ "${STATUS}" -eq 0 ]; then
            echo "Cloud Tasks API enabled."
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::warning::Cloud Tasks API could not be enabled by the deployment identity. The API will deploy with the safe local-executor fallback. Grant roles/serviceusage.serviceUsageAdmin once or enable cloudtasks.googleapis.com manually, then rerun this workflow."
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
          fi
          exit 0

      - name: Ensure Cloud Tasks queue
        id: task-queue
        if: steps.tasks-api.outputs.enabled == 'true'
        continue-on-error: true
        run: |
          gcloud tasks queues describe "${TASK_QUEUE}" \
            --location "${REGION}" \
            --project "${PROJECT_ID}" >/dev/null 2>&1 || \
          gcloud tasks queues create "${TASK_QUEUE}" \
            --location "${REGION}" \
            --project "${PROJECT_ID}" \
            --max-concurrent-dispatches=10 \
            --max-dispatches-per-second=5 \
            --max-attempts=3 \
            --min-backoff=5s \
            --max-backoff=60s

          gcloud tasks queues update "${TASK_QUEUE}" \
            --location "${REGION}" \
            --project "${PROJECT_ID}" \
            --max-concurrent-dispatches=10 \
            --max-dispatches-per-second=5 \
            --max-attempts=3 \
            --min-backoff=5s \
            --max-backoff=60s

      - name: Grant runtime queue permissions
        id: task-iam
        if: steps.tasks-api.outputs.enabled == 'true' && steps.task-queue.outcome == 'success'
        continue-on-error: true
        env:
          RUNTIME_SA: ${{ steps.runtime.outputs.service_account }}
        run: |
          gcloud projects add-iam-policy-binding "${PROJECT_ID}" \
            --member="serviceAccount:${RUNTIME_SA}" \
            --role="roles/cloudtasks.enqueuer" \
            --condition=None \
            --quiet

          gcloud iam service-accounts add-iam-policy-binding "${RUNTIME_SA}" \
            --member="serviceAccount:${RUNTIME_SA}" \
            --role="roles/iam.serviceAccountUser" \
            --project "${PROJECT_ID}" \
            --quiet

      - name: Deploy private analysis worker
        id: worker
        if: steps.tasks-api.outputs.enabled == 'true' && steps.task-queue.outcome == 'success' && steps.task-iam.outcome == 'success'
        continue-on-error: true
        env:
          RUNTIME_SA: ${{ steps.runtime.outputs.service_account }}
        run: |
          gcloud run deploy "${WORKER_SERVICE_NAME}" \
            --image "${REGION}-docker.pkg.dev/${PROJECT_ID}/${IMAGE_NAME}/${SERVICE_NAME}:${{ github.sha }}" \
            --platform managed \
            --region "${REGION}" \
            --no-allow-unauthenticated \
            --service-account "${RUNTIME_SA}" \
            --port 5003 \
            --memory 2Gi \
            --cpu 1 \
            --concurrency 1 \
            --max-instances 10 \
            --min-instances 0 \
            --timeout 900s \
            --set-env-vars="^@^PYTHONUNBUFFERED=1@GEOMOZ_SERVICE_ROLE=analysis-worker@ANALYSIS_EXECUTION_BACKEND=local@ANALYSIS_TASK_MAX_RETRIES=2@FIREBASE_PROJECT_ID=geoprocessamento-426809@GEOMOZ_STORAGE_BUCKET=geoprocessamento-426809.firebasestorage.app@GEOMOZ_ALLOW_RUNTIME_CONFIG=false" \
            --set-secrets=GEE_SERVICE_ACCOUNT_KEY=geomoz-gee-key:latest

      - name: Authorize Cloud Tasks to invoke worker
        id: worker-iam
        if: steps.worker.outcome == 'success'
        continue-on-error: true
        env:
          RUNTIME_SA: ${{ steps.runtime.outputs.service_account }}
        run: |
          gcloud run services add-iam-policy-binding "${WORKER_SERVICE_NAME}" \
            --region "${REGION}" \
            --member="serviceAccount:${RUNTIME_SA}" \
            --role="roles/run.invoker" \
            --quiet

      - name: Resolve worker URL
        id: worker-url
        if: steps.worker.outcome == 'success' && steps.worker-iam.outcome == 'success'
        continue-on-error: true
        run: |
          WORKER_URL=$(gcloud run services describe "${WORKER_SERVICE_NAME}" \
            --platform managed \
            --region "${REGION}" \
            --format 'value(status.url)')
          test -n "${WORKER_URL}"
          echo "worker_url=${WORKER_URL}" >> "${GITHUB_OUTPUT}"
          echo "Analysis worker: ${WORKER_URL}"

      - name: Deploy public API
        env:
          RUNTIME_SA: ${{ steps.runtime.outputs.service_account }}
          RESOLVED_WORKER_URL: ${{ steps.worker-url.outputs.worker_url }}
        run: |
          BACKEND="local"
          EXTRA_ANALYSIS_ENV=""

          if [ -n "${RESOLVED_WORKER_URL}" ]; then
            BACKEND="cloud_tasks"
            EXTRA_ANALYSIS_ENV="@ANALYSIS_TASKS_PROJECT=${PROJECT_ID}@ANALYSIS_TASKS_LOCATION=${REGION}@ANALYSIS_TASKS_QUEUE=${TASK_QUEUE}@ANALYSIS_WORKER_URL=${RESOLVED_WORKER_URL}@ANALYSIS_TASKS_AUDIENCE=${RESOLVED_WORKER_URL}@ANALYSIS_TASKS_SERVICE_ACCOUNT=${RUNTIME_SA}"
            echo "Deploying API with distributed Analysis Engine V2."
          else
            echo "::warning::Distributed worker bootstrap is incomplete. Deploying API with local executor fallback so production remains operational."
          fi

          gcloud run deploy "${SERVICE_NAME}" \
            --image "${REGION}-docker.pkg.dev/${PROJECT_ID}/${IMAGE_NAME}/${SERVICE_NAME}:${{ github.sha }}" \
            --platform managed \
            --region "${REGION}" \
            --allow-unauthenticated \
            --service-account "${RUNTIME_SA}" \
            --port 5003 \
            --memory 1Gi \
            --cpu 1 \
            --max-instances 10 \
            --min-instances 0 \
            --timeout 300s \
            --set-env-vars="^@^PYTHONUNBUFFERED=1@GEOMOZ_SERVICE_ROLE=api@ANALYSIS_EXECUTION_BACKEND=${BACKEND}@ANALYSIS_MAX_ACTIVE_PER_USER=5${EXTRA_ANALYSIS_ENV}@FIREBASE_PROJECT_ID=geoprocessamento-426809@GEOMOZ_STORAGE_BUCKET=geoprocessamento-426809.firebasestorage.app@GEOMOZ_ALLOW_RUNTIME_CONFIG=false@CORS_ORIGINS=https://geomoz.geolithica.com,https://geoprocessamento-426809.web.app,https://geoprocessamento-426809.firebaseapp.com" \
            --set-secrets=GEE_SERVICE_ACCOUNT_KEY=geomoz-gee-key:latest

      - name: Analysis Engine deployment status
        run: |
          if [ -n "${{ steps.worker-url.outputs.worker_url }}" ]; then
            echo "✅ Analysis Engine V2 distributed worker is active."
          else
            echo "⚠️ Analysis Engine V2 code is deployed, but Cloud Tasks bootstrap is pending."
            echo "Production is safely using the local executor fallback."
          fi

      - name: Get Service URL
        id: service-url
        run: |
          SERVICE_URL=$(gcloud run services describe "${SERVICE_NAME}" \
            --platform managed \
            --region "${REGION}" \
            --format 'value(status.url)')
          echo "service_url=${SERVICE_URL}" >> "${GITHUB_OUTPUT}"
          echo "Service deployed at: ${SERVICE_URL}"

      - name: Health check
        run: |
          SERVICE_URL="${{ steps.service-url.outputs.service_url }}"
          echo "Checking health at $SERVICE_URL/geomoz-api/health ..."
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SERVICE_URL/geomoz-api/health")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Health check passed (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS — waiting 10s..."
            sleep 10
          done
          echo "❌ Health check failed after 5 attempts"
          exit 1
