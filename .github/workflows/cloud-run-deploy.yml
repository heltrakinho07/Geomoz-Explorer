name: Deploy to Google Cloud Run

on:
  push:
    branches: [main, fix/geology-invalid-geometry]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: europe-west1
  SERVICE_NAME: geomoz-explorer-api
  ANALYSIS_JOB_NAME: geomoz-analysis-job
  IMAGE_NAME: geomoz-explorer-api

jobs:
  deploy:
    name: Build and Deploy to Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Google Cloud Authentication
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build Docker image
        run: |
          docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ env.SERVICE_NAME }}:latest \
            geomoz-explorer/

      - name: Push Docker image to Artifact Registry
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ env.SERVICE_NAME }}:latest

      - name: Resolve runtime service account
        id: runtime
        env:
          CONFIGURED_RUNTIME_SA: ${{ secrets.GCP_RUNTIME_SERVICE_ACCOUNT }}
        run: |
          if [ -n "${CONFIGURED_RUNTIME_SA}" ]; then
            RUNTIME_SA="${CONFIGURED_RUNTIME_SA}"
          else
            PROJECT_NUMBER=$(gcloud projects describe "${PROJECT_ID}" --format='value(projectNumber)')
            RUNTIME_SA="${PROJECT_NUMBER}-compute@developer.gserviceaccount.com"
          fi
          echo "service_account=${RUNTIME_SA}" >> "${GITHUB_OUTPUT}"
          echo "Using Cloud Run runtime identity: ${RUNTIME_SA}"

      - name: Deploy isolated analysis job
        id: analysis-job
        continue-on-error: true
        env:
          RUNTIME_SA: ${{ steps.runtime.outputs.service_account }}
        run: |
          gcloud run jobs deploy "${ANALYSIS_JOB_NAME}" \
            --image "${REGION}-docker.pkg.dev/${PROJECT_ID}/${IMAGE_NAME}/${SERVICE_NAME}:${{ github.sha }}" \
            --region "${REGION}" \
            --service-account "${RUNTIME_SA}" \
            --memory 2Gi \
            --cpu 1 \
            --tasks 1 \
            --parallelism 1 \
            --task-timeout 900s \
            --max-retries 2 \
            --command python \
            --args analysis_job_worker.py \
            --set-env-vars="^@^PYTHONUNBUFFERED=1@GEOMOZ_SERVICE_ROLE=analysis-job@ANALYSIS_EXECUTION_BACKEND=local@ANALYSIS_RUN_JOB_MAX_RETRIES=2@FIREBASE_PROJECT_ID=geoprocessamento-426809@GEOMOZ_STORAGE_BUCKET=geoprocessamento-426809.firebasestorage.app@GEOMOZ_ALLOW_RUNTIME_CONFIG=false" \
            --set-secrets=GEE_SERVICE_ACCOUNT_KEY=geomoz-gee-key:latest \
            --quiet

      - name: Authorize API to execute analysis job
        id: analysis-job-iam
        if: steps.analysis-job.outcome == 'success'
        continue-on-error: true
        env:
          RUNTIME_SA: ${{ steps.runtime.outputs.service_account }}
        run: |
          # Per-execution uid/job_id are supplied through env overrides, so
          # run.jobs.runWithOverrides is required. Scope it to this job only.
          gcloud run jobs add-iam-policy-binding "${ANALYSIS_JOB_NAME}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --member="serviceAccount:${RUNTIME_SA}" \
            --role="roles/run.jobsExecutorWithOverrides" \
            --quiet

      - name: Deploy public API
        env:
          RUNTIME_SA: ${{ steps.runtime.outputs.service_account }}
          ANALYSIS_JOB_DEPLOY_OUTCOME: ${{ steps.analysis-job.outcome }}
          ANALYSIS_JOB_IAM_OUTCOME: ${{ steps.analysis-job-iam.outcome }}
        run: |
          BACKEND="local"
          EXTRA_ANALYSIS_ENV=""

          if [ "${ANALYSIS_JOB_DEPLOY_OUTCOME}" = "success" ] && [ "${ANALYSIS_JOB_IAM_OUTCOME}" = "success" ]; then
            BACKEND="cloud_run_jobs"
            EXTRA_ANALYSIS_ENV="@ANALYSIS_RUN_JOB_PROJECT=${PROJECT_ID}@ANALYSIS_RUN_JOB_LOCATION=${REGION}@ANALYSIS_RUN_JOB_NAME=${ANALYSIS_JOB_NAME}@ANALYSIS_RUN_JOB_TIMEOUT_SECONDS=900"
            echo "Deploying API with isolated Cloud Run Jobs Analysis Engine."
          else
            echo "::warning::Cloud Run analysis job bootstrap is incomplete. Deploying API with local executor fallback so production remains operational."
          fi

          gcloud run deploy "${SERVICE_NAME}" \
            --image "${REGION}-docker.pkg.dev/${PROJECT_ID}/${IMAGE_NAME}/${SERVICE_NAME}:${{ github.sha }}" \
            --platform managed \
            --region "${REGION}" \
            --allow-unauthenticated \
            --service-account "${RUNTIME_SA}" \
            --port 5003 \
            --memory 1Gi \
            --cpu 1 \
            --max-instances 10 \
            --min-instances 0 \
            --timeout 300s \
            --set-env-vars="^@^PYTHONUNBUFFERED=1@GEOMOZ_SERVICE_ROLE=api@ANALYSIS_EXECUTION_BACKEND=${BACKEND}@ANALYSIS_MAX_ACTIVE_PER_USER=5${EXTRA_ANALYSIS_ENV}@FIREBASE_PROJECT_ID=geoprocessamento-426809@GEOMOZ_STORAGE_BUCKET=geoprocessamento-426809.firebasestorage.app@GEOMOZ_ALLOW_RUNTIME_CONFIG=false@CORS_ORIGINS=https://geomoz.geolithica.com,https://geoprocessamento-426809.web.app,https://geoprocessamento-426809.firebaseapp.com" \
            --set-secrets=GEE_SERVICE_ACCOUNT_KEY=geomoz-gee-key:latest

      - name: Analysis Engine deployment status
        run: |
          if [ "${{ steps.analysis-job.outcome }}" = "success" ] && [ "${{ steps.analysis-job-iam.outcome }}" = "success" ]; then
            echo "✅ Analysis Engine V2 isolated Cloud Run Jobs backend is active."
            echo "Job: ${ANALYSIS_JOB_NAME} (${REGION})"
          else
            echo "⚠️ Isolated analysis job bootstrap is incomplete."
            echo "Production is safely using the local executor fallback."
          fi

      - name: Get Service URL
        id: service-url
        run: |
          SERVICE_URL=$(gcloud run services describe "${SERVICE_NAME}" \
            --platform managed \
            --region "${REGION}" \
            --format 'value(status.url)')
          echo "service_url=${SERVICE_URL}" >> "${GITHUB_OUTPUT}"
          echo "Service deployed at: ${SERVICE_URL}"

      - name: Health check
        run: |
          SERVICE_URL="${{ steps.service-url.outputs.service_url }}"
          echo "Checking health at $SERVICE_URL/geomoz-api/health ..."
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SERVICE_URL/geomoz-api/health")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Health check passed (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS — waiting 10s..."
            sleep 10
          done
          echo "❌ Health check failed after 5 attempts"
          exit 1
