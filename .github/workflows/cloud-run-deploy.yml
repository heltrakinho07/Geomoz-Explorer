name: Deploy to Google Cloud Run

on:
  push:
    branches: [main]
    paths:
      - "geomoz-explorer/**"
      - ".github/workflows/cloud-run-deploy.yml"
  workflow_dispatch:

# A previous push must never roll back a newer Cloud Run revision.
concurrency:
  group: geomoz-cloudrun-production
  cancel-in-progress: true

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: europe-west1
  SERVICE_NAME: geomoz-explorer-api
  IMAGE_NAME: geomoz-explorer-api

jobs:
  deploy:
    name: Build and Deploy to Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Google Cloud Authentication
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build Docker image
        run: |
          docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ env.SERVICE_NAME }}:latest \
            geomoz-explorer/

      - name: Smoke check production image imports
        run: |
          docker run --rm --entrypoint python ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}             -c "import api; import processing_jobs; print('GeoMoz API image imports OK')"

      - name: Push Docker image to Artifact Registry
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ env.SERVICE_NAME }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --port 5003 \
            --memory 1Gi \
            --cpu 1 \
            --max-instances 10 \
            --min-instances 0 \
            --timeout 300s \
            --set-env-vars="^@^PYTHONUNBUFFERED=1@FIREBASE_PROJECT_ID=geoprocessamento-426809@ALLOW_SERVER_GEE_FALLBACK=true@CORS_ORIGINS=https://geoprocessamento-426809.web.app,https://geoprocessamento-426809.firebaseapp.com,https://geomoz.geolithica.com" \
            --set-secrets=GEE_SERVICE_ACCOUNT_KEY=geomoz-gee-key:latest

      - name: Get Service URL
        id: service-url
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --format 'value(status.url)')
          echo "service_url=$SERVICE_URL" >> $GITHUB_OUTPUT
          echo "Service deployed at: $SERVICE_URL"

      - name: Health check
        run: |
          SERVICE_URL="${{ steps.service-url.outputs.service_url }}"
          echo "Checking health at $SERVICE_URL/geomoz-api/health ..."
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SERVICE_URL/geomoz-api/health")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Health check passed (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS — waiting 10s..."
            sleep 10
          done
          echo "❌ Health check failed after 5 attempts"
          exit 1

      - name: Diagnose failed Cloud Run startup
        if: failure()
        continue-on-error: true
        run: |
          echo "Cloud Run revision status:"
          REVISION=$(gcloud run revisions list \
            --service "$SERVICE_NAME" --region "$REGION" \
            --sort-by='~metadata.creationTimestamp' --limit=1 \
            --format='value(metadata.name)' 2>/dev/null || true)
          if [ -n "$REVISION" ]; then
            gcloud run revisions describe "$REVISION" --region "$REGION" \
              --format='yaml(status.conditions)' || true
          fi
          echo "Recent Cloud Run ERROR logs (sanitized):"
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="geomoz-explorer-api" AND severity>=ERROR' \
            --project "$PROJECT_ID" --freshness=20m --limit=20 \
            --format='value(textPayload)' 2>&1 \
            | sed -E 's/(Bearer )[A-Za-z0-9._-]+/\1[REDACTED]/g' \
            | tail -80 || true

      - name: Comment PR with deployment URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Deployed to Cloud Run: ${{ steps.service-url.outputs.service_url }}'
            })

