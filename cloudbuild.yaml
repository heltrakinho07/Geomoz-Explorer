steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'europe-west1-docker.pkg.dev/$PROJECT_ID/geomoz-explorer-api/geomoz-explorer-api:$BUILD_ID', '-t', 'europe-west1-docker.pkg.dev/$PROJECT_ID/geomoz-explorer-api/geomoz-explorer-api:latest', '-f', 'geomoz-explorer/Dockerfile', 'geomoz-explorer/']

  # Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'europe-west1-docker.pkg.dev/$PROJECT_ID/geomoz-explorer-api/geomoz-explorer-api:$BUILD_ID']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'europe-west1-docker.pkg.dev/$PROJECT_ID/geomoz-explorer-api/geomoz-explorer-api:latest']

  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'geomoz-explorer-api'
      - '--image=europe-west1-docker.pkg.dev/$PROJECT_ID/geomoz-explorer-api/geomoz-explorer-api:$BUILD_ID'
      - '--platform=managed'
      - '--region=europe-west1'
      - '--allow-unauthenticated'
      - '--port=5003'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--max-instances=10'
      - '--min-instances=0'
      - '--timeout=300s'
      - '--set-env-vars=PYTHONUNBUFFERED=1'

images:
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/geomoz-explorer-api/geomoz-explorer-api:$BUILD_ID'
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/geomoz-explorer-api/geomoz-explorer-api:latest'
