[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "branca>=0.8.2",
    "fastapi>=0.136.1",
    "folium>=0.20.0",
    "geomoz>=0.1.1",
    "geopandas>=1.1.3",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pandas>=3.0.3",
    "python-multipart>=0.0.28",
    "shapely>=2.1.2",
    "streamlit>=1.57.0",
    "streamlit-folium>=0.27.2",
    "uvicorn>=0.46.0",
    # Security: GHSA-65pc-fj4g-8rjx — idna 3.14 is vulnerable; fixed in 3.16
    "idna>=3.16",
    # Security: PYSEC-2026-161 — starlette 1.0.0 is vulnerable; fixed in 1.0.1
    "starlette>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.25.0",
    "ruff>=0.11.0",
]

[tool.pytest.ini_options]
testpaths = [
    "geomoz-explorer/tests",
]
python_files = ["test_*.py"]
pythonpath = ["geomoz-explorer"]
# Note: for best results, also run:
#   pip install -e geomoz-explorer/
# This installs the package and its sibling module imports natively,
# eliminating the sys.path fallback hack in api.py.
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
