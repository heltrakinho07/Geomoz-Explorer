<!-- GeoMoz navigation remains present throughout the original GeoLibre runtime.
     All module links stay on the GeoMoz domain; no external iframe or fake GIS operations. -->
<div class="geomoz-portal-shell" data-geomoz-shell="true">
  <header class="geomoz-portal-top" aria-label="GeoMoz — navegação principal">
    <a class="geomoz-portal-brand" href="/dashboard" title="Painel principal do GeoMoz">
      <img src="/gis-workspace/favicon.svg" alt="" width="27" height="27" />
      <span class="geomoz-portal-brand-name">GeoMoz</span>
      <span class="geomoz-portal-brand-separator" aria-hidden="true"></span>
      <span class="geomoz-portal-brand-context">Explorer</span>
    </a>
    <nav class="geomoz-portal-nav" aria-label="Módulos do GeoMoz">
      <a href="/dashboard">Painel</a>
      <a href="/mapa">Mapa</a>
      <a href="/gis-workspace/" aria-current="page">GIS Workspace</a>
      <a href="/analises">GeoAnálises</a>
      <a href="/hidrografia">Hidrografia</a>
      <a href="/geomoz-ai">GeoMoz AI</a>
    </nav>
    <div class="geomoz-portal-context" title="Ferramentas SIG executadas no navegador; projectos locais devem ser guardados antes de mudar de módulo.">
      <span class="geomoz-mode-dot" aria-hidden="true"></span>
      Modo SIG
    </div>
  </header>
  <!-- Each command opens the *real* GeoLibre menu, which owns permissions,
       callbacks, dialogs and processing engines. No duplicate processing UI. -->
  <div class="geomoz-gis-commandbar" role="toolbar" aria-label="Acesso rápido às ferramentas SIG">
    <span class="geomoz-gis-commandbar-title">Ferramentas SIG</span>
    <div class="geomoz-gis-commandbar-items">
      <button type="button" data-geomoz-menu="Project" title="Abrir o menu de projectos do GIS Workspace">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h7l2 2h9v10H3zM3 7V5h7l2 2"/></svg>
        <span>Projecto</span>
      </button>
      <button type="button" data-geomoz-menu="Add Data" title="Abrir importação de dados vectoriais, raster e serviços">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v13m-5-5 5 5 5-5M4 19h16"/></svg>
        <span>Adicionar dados</span>
      </button>
      <span class="geomoz-gis-divider" aria-hidden="true"></span>
      <button type="button" data-geomoz-menu="Edit" title="Abrir ferramentas de edição">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 20 5-1 10-10-4-4L5 15zM13 7l4 4"/></svg>
        <span>Editar</span>
      </button>
      <button type="button" data-geomoz-menu="View" title="Abrir modos de visualização, incluindo 2D e 3D">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12c2.5-4 5.9-6 10-6s7.5 2 10 6c-2.5 4-5.9 6-10 6s-7.5-2-10-6z"/><circle cx="12" cy="12" r="2.5"/></svg>
        <span>Vista</span>
      </button>
      <span class="geomoz-gis-divider" aria-hidden="true"></span>
      <button type="button" data-geomoz-menu="Processing" title="Abrir as ferramentas de geoprocessamento originais">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h7M4 17h7m5-10h4m-4 10h4M11 5v4m4 6v4"/></svg>
        <span>Processamento</span>
      </button>
      <button type="button" data-geomoz-menu="Controls" title="Abrir os controlos e ferramentas cartográficas">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M4 12h16M4 19h16"/><circle cx="9" cy="5" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="11" cy="19" r="2"/></svg>
        <span>Controlos</span>
      </button>
      <button type="button" data-geomoz-menu="Plugins" title="Abrir extensões e plugins">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6v4h4v6h-4v7H5v-7h4V9H5V3z"/></svg>
        <span>Extensões</span>
      </button>
      <button type="button" data-geomoz-menu="Settings" title="Abrir as configurações GIS">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2m0-14-2 2M7 17l-2 2"/></svg>
        <span>Configurações</span>
      </button>
    </div>
    <span id="geomoz-gis-command-status" class="geomoz-command-status" role="status" aria-live="polite"></span>
  </div>
</div>
