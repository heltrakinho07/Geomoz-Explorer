kind = "web"
previewPath = "/"
title = "GeoMoz Explorer"
version = "1.0.0"
id = "artifacts/geomoz-react"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20643

[services.development]
run = "pnpm --filter @workspace/geomoz-react run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/geomoz-react", "run", "build" ]
publicDir = "artifacts/geomoz-react/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20643"
BASE_PATH = "/"
