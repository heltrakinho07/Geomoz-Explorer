kind = "web"
previewPath = "/geomoz-api"
title = "GeoMoz Python API"
version = "1.0.0"

[[services]]
localPort = 5001
name = "GeoMoz Python API"
paths = ["/geomoz-api"]

[services.development]
run = "cd /home/runner/workspace/geomoz-explorer && uvicorn api:app --host 0.0.0.0 --port 5001"

[services.production]
build = ["pip", "install", "-r", "geomoz-explorer/requirements.txt", "-q"]
run = "uvicorn api:app --app-dir geomoz-explorer --host 0.0.0.0 --port 5001 --workers 2"
